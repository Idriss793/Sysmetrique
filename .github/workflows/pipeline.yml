name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_API: ${{ secrets.DOCKERHUB_USERNAME }}/sysmetrics
  IMAGE_AGENT: ${{ secrets.DOCKERHUB_USERNAME }}/sysmetrics-agent

jobs:
  # ---------- 1. TESTS ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install pytest httpx pytest-mock

      - name: Lancer les tests
        run: pytest tests/ -v
        env:
          PYTHONPATH: .

  # ---------- 2. BUILD + SCAN TRIVY ----------
  build-and-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build image API (target base)
        run: docker build --target base -t $IMAGE_API:${{ github.sha }} .

      - name: Build image Agent (target agent)
        run: docker build --target agent -t $IMAGE_AGENT:${{ github.sha }} .

      - name: Scan Trivy - API
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_API }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan Trivy - Agent
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_AGENT }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ---------- 3. CD : PUSH SUR DOCKER HUB ----------
  push:
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push API
        run: |
          docker build --target base -t $IMAGE_API:latest -t $IMAGE_API:${{ github.sha }} .
          docker push $IMAGE_API:latest
          docker push $IMAGE_API:${{ github.sha }}

      - name: Build et push Agent
        run: |
          docker build --target agent -t $IMAGE_AGENT:latest -t $IMAGE_AGENT:${{ github.sha }} .
          docker push $IMAGE_AGENT:latest
          docker push $IMAGE_AGENT:${{ github.sha }}